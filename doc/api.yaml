openapi: 3.0.3
info:
  title: WASAText API
  description: >
    OpenAPI definition for the WASAText messaging platform.
    The system allows users to send messages (one-to-one and group),
    manage profiles, and interact with conversations.
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development server

# Global security: use Bearer identifier returned by /session
security:
  - BearerAuth: []

paths:
  # =====================
  # Authentication
  # =====================
  /session:
    post:
      tags: ["login"]
      summary: Login or register a user
      description: >
        Simplified login: if the user exists, returns its identifier;
        otherwise, creates a new user and returns the identifier.
      operationId: doLogin
      security: []   # public endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: User login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request

  # =====================
  # Profile Management (for the authenticated user)
  # =====================
  /me:
    get:
      tags: ["profile"]
      summary: Get my profile information
      operationId: getMyProfile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /me/name:
    put:
      tags: ["profile"]
      summary: Update my username
      operationId: setMyUserName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserNameRequest"
      responses:
        "200":
          description: Username updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
        "409":
          description: Username already in use
        "401":
          description: Unauthorized

  /me/photo:
    put:
      tags: ["profile"]
      summary: Update my profile photo
      operationId: setMyPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SetPhotoRequest"
      responses:
        "200":
          description: Profile photo updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized

  /me/conversations:
    get:
      tags: ["conversations"]
      summary: Retrieve all my conversations (reverse chronological)
      operationId: getMyConversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        "401":
          description: Unauthorized

  /me/groups:
    get:
      tags: ["groups"]
      summary: Retrieve all groups the authenticated user belongs to
      operationId: getMyGroups
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
        "401":
          description: Unauthorized

  # =====================
  # Conversations
  # =====================
  /conversations:
    post:
      tags: ["conversations"]
      summary: Create a new conversation (1-to-1 or group)
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Conversation created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized

  /conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        description: Conversation identifier
        schema:
          type: string
    get:
      tags: ["conversations"]
      summary: Get details and messages of a conversation
      operationId: getConversation
      responses:
        "200":
          description: Conversation details with messages (reverse chronological)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetails"
        "404":
          description: Conversation not found
        "401":
          description: Unauthorized
    delete:
      tags: ["conversations"]
      summary: Leave the conversation (or delete if owner)
      operationId: deleteConversation
      description: >
        Authenticated user leaves the conversation. For private 1-to-1 conversation this removes it from user's list;
        for groups it removes the member. If the implementation includes an owner/admin delete action, it may delete the conversation entirely.
      responses:
        "200":
          description: Left conversation successfully
        "401":
          description: Unauthorized
        "404":
          description: Conversation not found
        "403":
          description: Forbidden

  # =====================
  # Messages (belonging to a conversation)
  # =====================
  /conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        description: Conversation identifier
        schema:
          type: string
    post:
      tags: ["messages"]
      summary: Send a new message in a conversation (or reply)
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Conversation not found
        '401':
          description: Unauthorized
    get:
      tags: ["messages"]
      summary: Get all messages in a conversation (reverse chronological)
      operationId: getConversationMessages
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '404':
          description: Conversation not found
        '401':
          description: Unauthorized

  /conversations/{conversationId}/messages/{messageId}/forward:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: ["messages"]
      summary: Forward a message to another conversation (single or multiple targets)
      operationId: forwardMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardMessageRequest"
      responses:
        "201":
          description: Message forwarded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Conversation or message not found
        "401":
          description: Unauthorized

  /conversations/{conversationId}/messages/{messageId}/reactions:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: ["messages"]
      summary: Add a reaction (comment) to a message
      operationId: commentMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "201":
          description: Reaction added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reaction"
        "404":
          description: Message not found
        "401":
          description: Unauthorized
    delete:
      tags: ["messages"]
      summary: Remove the authenticated user's reaction from a message
      operationId: uncommentMessage
      parameters:
        - name: emoji
          in: query
          required: false
          schema:
            type: string
          description: Optional emoji to remove; if omitted removes user's last reaction
      responses:
        "200":
          description: Reaction removed
        "404":
          description: Reaction or message not found
        "401":
          description: Unauthorized

  /conversations/{conversationId}/messages/{messageId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: ["messages"]
      summary: Delete one of my messages
      operationId: deleteMessage
      responses:
        "200":
          description: Message deleted successfully
        "403":
          description: Not allowed to delete this message
        "404":
          description: Message not found
        "401":
          description: Unauthorized
    get:
      tags: ["messages"]
      summary: Get a single message
      operationId: getMessage
      responses:
        "200":
          description: Message retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Message not found
        "401":
          description: Unauthorized

  # =====================
  # Groups
  # =====================
  /groups:
    post:
      tags: ["groups"]
      summary: Create a new group
      operationId: createGroup
      description: Creates a new group with the specified members and name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Invalid request (e.g. missing name or members)
        '401':
          description: Unauthorized
    get:
      tags: ["groups"]
      summary: Retrieve groups visible (or all, depending on policies). Typically backend filters to groups of user.
      operationId: listGroups
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
        "401":
          description: Unauthorized

  /groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        description: ID of the group
        schema:
          type: string
    get:
      tags: ["groups"]
      summary: Get group details
      operationId: getGroup
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "404":
          description: Group not found
        "401":
          description: Unauthorized
    delete:
      tags: ["groups"]
      summary: Delete group (admin/owner only)
      operationId: deleteGroup
      responses:
        "200":
          description: Group deleted
        "403":
          description: Forbidden
        "401":
          description: Unauthorized

  /groups/{groupId}/members:
    parameters:
      - name: groupId
        in: path
        required: true
        description: ID of the group
        schema:
          type: string
    get:
      tags: ["groups"]
      summary: List group members
      operationId: listGroupMembers
      responses:
        "200":
          description: Members list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "404":
          description: Group not found
        "401":
          description: Unauthorized
    post:
      tags: ["groups"]
      summary: Add a user to the group
      operationId: addToGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToGroupRequest"
      responses:
        "200":
          description: User added to group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "404":
          description: Group not found
        "401":
          description: Unauthorized

  /groups/{groupId}/members/me:
    parameters:
      - name: groupId
        in: path
        required: true
        description: ID of the group
        schema:
          type: string
    delete:
      tags: ["groups"]
      summary: Leave a group (authenticated user)
      operationId: leaveGroup
      responses:
        "200":
          description: Left group successfully
        "404":
          description: Group not found
        "401":
          description: Unauthorized

  /groups/{groupId}/name:
    parameters:
      - name: groupId
        in: path
        required: true
        description: ID of the group
        schema:
          type: string
    put:
      tags: ["groups"]
      summary: Change group name
      operationId: setGroupName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetGroupNameRequest"
      responses:
        "200":
          description: Group name updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "404":
          description: Group not found
        "409":
          description: Name already in use
        "401":
          description: Unauthorized

  /groups/{groupId}/photo:
    parameters:
      - name: groupId
        in: path
        required: true
        description: ID of the group
        schema:
          type: string
    put:
      tags: ["groups"]
      summary: Update group photo
      operationId: setGroupPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SetPhotoRequest"
      responses:
        "200":
          description: Group photo updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "404":
          description: Group not found
        "401":
          description: Unauthorized

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "Identifier"

  schemas:
    # -----------------------
    # Authentication
    # -----------------------
    LoginRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 16
          example: Maria

    LoginResponse:
      type: object
      properties:
        identifier:
          type: string
          example: "abcdef012345"

    # -----------------------
    # User / Profile
    # -----------------------
    User:
      type: object
      properties:
        id:
          type: string
          example: "user_123"
        name:
          type: string
          example: "Maria Rossi"
        photoUrl:
          type: string
          format: uri
          example: "https://example.com/photos/user_123.jpg"

    SetUserNameRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          example: "NuovoNome"

    SetPhotoRequest:
      type: object
      properties:
        photo:
          type: string
          format: binary
          description: "Binary file upload (multipart/form-data)"

    # -----------------------
    # Conversations & Messages
    # -----------------------
    CreateConversationRequest:
      type: object
      properties:
        participantIds:
          type: array
          items:
            type: string
          description: IDs of the users to include in the conversation
        isGroup:
          type: boolean
          description: True if the conversation is a group chat
        groupName:
          type: string
          description: Optional name of the group
      required:
        - participantIds

    Conversation:
      type: object
      properties:
        id:
          type: string
          example: "conv_abc123"
        name:
          type: string
          nullable: true
          example: "Amici del corso"
        isGroup:
          type: boolean
          example: false
        photoUrl:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/photos/group_1.jpg"
        lastMessage:
          type: string
          nullable: true
          example: "Ciao, a che ora ci vediamo?"
        lastMessageTime:
          type: string
          format: date-time
          nullable: true
          example: "2025-10-30T18:05:00Z"

    ConversationDetails:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        isGroup:
          type: boolean
        participants:
          type: array
          items:
            $ref: "#/components/schemas/User"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    Message:
      type: object
      properties:
        id:
          type: string
          example: "msg_001"
        conversationId:
          type: string
          example: "conv_abc123"
        sender:
          $ref: "#/components/schemas/User"
        timestamp:
          type: string
          format: date-time
          example: "2025-10-30T18:10:00Z"
        content:
          type: string
          nullable: true
          example: "Ciao!"
        replyTo:
          type: string
          nullable: true
          description: "ID of the message being replied to (if any)"
        type:
          type: string
          enum: ["text", "photo"]
          example: "text"
        attachments:
          type: array
          items:
            type: string
            example: "https://example.com/attachments/att1.jpg"
        status:
          type: string
          enum: ["sent", "received", "read"]
          example: "sent"
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/Reaction"

    Reaction:
      type: object
      properties:
        id:
          type: string
          example: "r_01"
        emoji:
          type: string
          example: "👍"
        user:
          $ref: "#/components/schemas/User"

    # -----------------------
    # Requests for message operations
    # -----------------------
    SendMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          example: "Ciao, come va?"
        replyTo:
          type: string
          nullable: true
          description: "Optional message ID being replied to"
        attachments:
          type: array
          items:
            type: string
            example: "https://example.com/attachments/att1.jpg"

    ForwardMessageRequest:
      type: object
      required:
        - targetConversationId
      properties:
        targetConversationId:
          type: string
          description: ID of the conversation where the message is forwarded
          example: "conv_target_456"
        comment:
          type: string
          nullable: true
          description: "Optional comment to add while forwarding"

    CommentRequest:
      type: object
      required:
        - emoji
      properties:
        emoji:
          type: string
          example: "😀"

    # -----------------------
    # Groups
    # -----------------------
    CreateGroupRequest:
      type: object
      required:
        - name
        - members
      properties:
        name:
          type: string
          example: "Gruppo amici università"
        members:
          type: array
          items:
            type: string
          description: "List of user identifiers to add to the group"
          example: ["user123", "user456"]

    AddToGroupRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          example: "user_456"

    SetGroupNameRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Amici del corso"

    Group:
      type: object
      properties:
        id:
          type: string
          example: "group789"
        name:
          type: string
          example: "Gruppo amici università"
        members:
          type: array
          items:
            type: string
          example: ["user123", "user456", "user789"]
        photoUrl:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/photos/group_1.jpg"
        createdAt:
          type: string
          format: date-time
          example: "2025-10-30T18:05:00Z"

